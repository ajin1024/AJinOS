<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJinOS · Super Agent</title>
<style>
/* Brand tokens from client/src/theme.css. */
:root {
  --ui-rail: #eef0f6;
  --ui-surface: #f4f6fa;
  --ui-bg: #f9fafc;
  --ui-panel: #ffffff;
  --ui-raised: #ffffff;
  --ui-line: #e2e6f0;
  --ui-wire: #bfc7da;
  --ui-text: #171c28;
  --ui-secondary: var(--ui-text-secondary);
  --ui-text-secondary: #475166;
  --ui-muted: #747f96;
  --ui-accent: #4f6ae8;
  --ui-accent-on: #ffffff;
  --ui-accent-ink: #3b53cc;
  --ui-soft: #e9eefd;
  --ui-success: #168a5b;
  --ui-success-soft: #e7f7ef;
  --ui-warn: #b4690e;
  --ui-warn-soft: #fdf3e3;
  --ui-danger: #c93b44;
  --ui-danger-soft: #fdecef;
  --ui-neutral-badge: #646e82;
  --ui-neutral-badge-soft: #eceff5;
  --ui-accent-hover: #3f58d6;
  --ui-accent-active: #3349bd;
  --ui-accent-line: #7a91f2;
  --ui-overlay: #161924;
  --ui-shadow: #171c28;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ui-rail: #11131c;
  --ui-surface: #161924;
  --ui-bg: #1b1f2c;
  --ui-panel: #212636;
  --ui-raised: #272d40;
  --ui-line: #2e354a;
  --ui-wire: #444e6b;
  --ui-text: #e8ecf7;
  --ui-secondary: var(--ui-text-secondary);
  --ui-text-secondary: #b4bed6;
  --ui-muted: #7d88a3;
  --ui-accent: #7aa2f7;
  --ui-accent-on: #101524;
  --ui-accent-ink: #8db1fa;
  --ui-soft: #252e47;
  --ui-success: #34d399;
  --ui-success-soft: #18352c;
  --ui-warn: #f2b84b;
  --ui-warn-soft: #3a2e1b;
  --ui-danger: #f87171;
  --ui-danger-soft: #3b2026;
  --ui-neutral-badge: #8b95b0;
  --ui-neutral-badge-soft: #252a3a;
  --ui-accent-hover: #8db1fa;
  --ui-accent-active: #658ee8;
  --ui-accent-line: #5d82d6;
  --ui-overlay: #10131c;
  --ui-shadow: #10131c;
  color-scheme: dark;
}

:root {
  --rail-width: 52px;
  --sidebar-width: 268px;
  --drawer-width: 368px;
  --content-width: 760px;
  --aside-bg: color-mix(in srgb, var(--ui-bg) 75%, var(--ui-panel));
  --warm-line: color-mix(in srgb, var(--ui-warn) 20%, var(--ui-line));
  --mono: "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; color: var(--ui-text); background: var(--ui-panel);
  font: 14px/1.55 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .58; }
:where(button, input, select, textarea, summary):focus-visible { outline: 2px solid var(--ui-accent-line); outline-offset: 2px; }
:where(h1, h2, h3, p, dl, dd, pre, fieldset) { margin: 0; }
:where(h1, h2, h3) { line-height: 1.35; }
small { font-size: 12px; }
svg.icon { width: 18px; height: 18px; flex: none; }
svg.symbols { position: absolute; width: 0; height: 0; pointer-events: none; }
.muted { color: var(--ui-muted); }
.secondary { color: var(--ui-text-secondary); }
.mono { font-family: var(--mono); }
.row, .wrap { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.dot { display: inline-block; width: 7px; height: 7px; flex: none; border-radius: 50%; background: currentColor; }
.dot.live { color: var(--ui-success); }
.chip {
  display: inline-flex; align-items: center; gap: 5px; width: max-content; max-width: 100%;
  padding: 2px 7px; border-radius: 5px; background: var(--ui-surface);
  color: var(--ui-text-secondary); font-size: 11px; line-height: 1.5;
}
.chip svg { width: 13px; height: 13px; }
.chip.amber { color: var(--ui-warn); background: var(--ui-warn-soft); }
.chip.green { color: var(--ui-success); background: var(--ui-success-soft); }
.chip.blue { color: var(--ui-accent-ink); background: var(--ui-soft); }
.chip.neutral { color: var(--ui-text-secondary); background: var(--ui-neutral-badge-soft); }
.btn, .icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--ui-line); border-radius: 7px; background: var(--ui-panel);
  padding: 5px 11px; min-height: 31px; font-size: 12px; font-weight: 600;
}
.btn:hover:not(:disabled), .icon-btn:hover:not(:disabled) { background: var(--ui-surface); }
.btn.primary { color: var(--ui-accent-on); background: var(--ui-accent); border-color: var(--ui-accent); }
.btn.primary:hover:not(:disabled) { background: var(--ui-accent-hover); border-color: var(--ui-accent-hover); }
.btn.ghost, .icon-btn { border-color: transparent; background: transparent; }
.btn.ghost { color: var(--ui-text-secondary); }
.btn.danger { color: var(--ui-danger); }
.btn svg { width: 15px; height: 15px; }
.icon-btn { width: 32px; height: 32px; padding: 0; color: var(--ui-text-secondary); }
.link {
  display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none;
  color: var(--ui-accent-ink); font-size: inherit; text-align: left;
}
.link svg { width: 13px; height: 13px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

.app { display: grid; grid-template-columns: var(--rail-width) minmax(0, 1fr); height: 100dvh; }
.rail { z-index: 6; background: var(--ui-rail); border-right: 1px solid var(--ui-line); }
.rail, .rail nav, .rail-foot { display: flex; flex-direction: column; align-items: center; }
.rail nav { gap: 9px; }
.rail-foot { gap: 14px; margin: auto 0 18px; }
.brand { margin: 15px 0 19px; width: 34px; height: 34px; color: var(--ui-accent-ink); }
.brand svg { width: 25px; height: 25px; }
.rail-button { position: relative; width: 36px; height: 36px; border-radius: 9px; }
.rail-button svg { width: 20px; height: 20px; }
.rail-button[aria-current] { color: var(--ui-accent-ink); background: var(--ui-soft); }
.rail-button[aria-current]::before {
  content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 2px;
  background: var(--ui-accent); border-radius: 0 2px 2px 0;
}
.rail-count {
  position: absolute; top: -5px; right: -4px; min-width: 17px; height: 17px; padding: 0 3px;
  border: 1px solid var(--ui-rail); border-radius: 9px; background: var(--ui-warn-soft); color: var(--ui-warn);
  font-size: 10px; line-height: 15px; text-align: center; font-weight: 750;
}
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip); position: absolute; z-index: 1; left: calc(100% + 9px); top: 50%;
  transform: translateY(-50%); opacity: 0; visibility: hidden; pointer-events: none;
  padding: 4px 8px; border-radius: 5px; background: var(--ui-raised); border: 1px solid var(--ui-line);
  color: var(--ui-text); font-size: 12px; font-weight: 500; white-space: nowrap;
}
[data-tooltip]:is(:hover, :focus-visible)::after { visibility: visible; opacity: 1; }
.rail-engine { display: grid; place-items: center; width: 24px; height: 15px; }
.stage {
  display: grid; grid-template-columns: minmax(0, 1fr); position: relative; isolation: isolate;
  min-height: 0; min-width: 0;
}
.stage.has-sidebar { grid-template-columns: var(--sidebar-width) minmax(0, 1fr); }
.stage.has-drawer { grid-template-columns: minmax(0, 1fr) var(--drawer-width); }
.stage.has-sidebar.has-drawer { grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--drawer-width); }
.sidebar {
  display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: auto;
  padding: 18px 13px; border-right: 1px solid var(--ui-line); background: var(--aside-bg);
}
.side-heading { min-height: 30px; padding: 0 4px 0 5px; }
.wordmark { font-size: 20px; font-weight: 720; letter-spacing: -.65px; line-height: 1.2; }
.side-filters { display: grid; gap: 8px; padding: 10px 4px 15px; }
.control {
  width: 100%; min-width: 0; min-height: 34px; padding: 6px 9px; border: 1px solid var(--ui-line);
  border-radius: 7px; background: var(--ui-panel); font-size: 12px;
}
.select-project { padding-left: 30px; appearance: none; padding-right: 27px; cursor: pointer; }
.select-wrap { position: relative; }
.select-wrap svg { position: absolute; left: 9px; top: 9px; width: 15px; height: 15px; color: var(--ui-muted); pointer-events: none; }
.select-wrap svg:last-child { left: auto; right: 8px; }
.side-card {
  width: 100%; display: flex; align-items: center; gap: 9px; text-align: left; border: 1px solid transparent;
  background: transparent; border-radius: 9px; padding: 10px 8px; min-width: 0;
}
.side-card:hover { background: var(--ui-surface); }
.side-card[aria-current] { background: var(--ui-soft); border-color: color-mix(in srgb, var(--ui-accent) 14%, var(--ui-line)); }
.side-card strong { display: block; font-size: 13px; }
.side-card small { font-size: 10px; }
.avatar {
  display: grid; place-items: center; flex: none; position: relative; width: 30px; height: 30px;
  border-radius: 8px; background: var(--ui-soft); color: var(--ui-accent-ink);
}
.avatar svg { width: 19px; height: 19px; }
.avatar.large { width: 36px; height: 36px; border-radius: 9px; }
.avatar.large svg { width: 22px; height: 22px; }
.avatar .dot { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border: 2px solid var(--ui-panel); }
.avatar.plain { background: var(--ui-surface); color: var(--ui-text-secondary); }
.avatar.checked { background: var(--ui-success-soft); color: var(--ui-success); }
.inbox-entry { margin-top: 9px; background: var(--ui-warn-soft); border-color: var(--warm-line); }
.inbox-entry:hover, .inbox-entry[aria-current] { background: color-mix(in srgb, var(--ui-warn) 12%, var(--ui-warn-soft)); border-color: var(--warm-line); }
.inbox-entry .avatar { color: var(--ui-warn); background: transparent; }
.inbox-entry small, .inbox-entry .count { color: var(--ui-warn); }
.count { min-width: 22px; text-align: center; border-radius: 5px; font-size: 12px; font-weight: 700; }
.inbox-entry .count { background: var(--ui-panel); }
.recent { margin-top: 22px; }
.recent h2 { padding: 0 5px; font-size: 12px; margin-bottom: 8px; color: var(--ui-text-secondary); }
.filters { gap: 3px; padding: 0 4px 8px; }
.filter { min-height: 25px; border: 0; border-radius: 5px; padding: 3px 8px; background: transparent; color: var(--ui-text-secondary); font-size: 11px; }
.filter:hover { background: var(--ui-surface); }
.filter[aria-pressed="true"] { color: var(--ui-accent-ink); background: var(--ui-soft); font-weight: 650; }
.thread-item {
  position: relative; width: 100%; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center;
  gap: 5px 6px; padding: 9px 8px; border: 1px solid transparent; border-radius: 8px; text-align: left;
  background: transparent;
}
.thread-item:hover { background: var(--ui-surface); }
.thread-item[aria-current] { background: var(--ui-soft); border-color: color-mix(in srgb, var(--ui-accent) 14%, var(--ui-line)); }
.thread-item strong { font-size: 12px; font-weight: 650; }
.thread-item time { font-size: 10px; font-variant-numeric: tabular-nums; color: var(--ui-muted); }
.thread-item .chip { font-size: 10px; padding: 1px 5px; }
.thread-item .thread-status { justify-self: end; }
.sidebar-empty { color: var(--ui-muted); padding: 12px 6px; font-size: 12px; }

.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.view-header {
  display: flex; align-items: center; gap: 12px; min-height: 68px; flex: none;
  padding: 11px 26px; border-bottom: 1px solid var(--ui-line); background: var(--ui-panel);
}
.view-header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.25px; }
.view-header .subtitle { margin-top: 2px; font-size: 11px; color: var(--ui-text-secondary); }
.view-header .sub-row { gap: 6px; }
.engine {
  display: inline-flex; align-items: center; flex: none; gap: 6px; border: 1px solid var(--ui-line);
  padding: 4px 9px; border-radius: 50px; color: var(--ui-text-secondary); font-size: 11px; white-space: nowrap;
}
.engine .dot { width: 6px; height: 6px; }
.snapshot { gap: 7px; margin-right: 2px; }
.snapshot button {
  display: flex; gap: 5px; align-items: center; border: 0; border-radius: 5px; background: transparent;
  color: var(--ui-text-secondary); padding: 4px; font-size: 11px; white-space: nowrap;
}
.snapshot button:hover { background: var(--ui-surface); }
.snapshot b { font: 650 11px var(--mono); }
.snapshot button:nth-of-type(-n+2) b { color: var(--ui-warn); }
.snapshot .divider { color: var(--ui-wire); }
.mobile-menu { display: none; }
.scroller { flex: 1; min-width: 0; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--ui-wire) transparent; }
.conversation { width: min(100%, var(--content-width)); margin: 0 auto; padding: 12px 0 12px; }
.conversation-scroll { padding-inline: 26px; }
.day-divider {
  display: flex; align-items: center; gap: 10px; color: var(--ui-muted);
  font-size: 11px; margin: 1px 0 11px;
}
.day-divider::before, .day-divider::after { content: ""; flex: 1; border-top: 1px solid var(--ui-line); }
.exchange + .exchange { margin-top: 13px; }
.user-message { display: grid; justify-items: end; margin: 0 0 8px 34px; gap: 4px; }
.user-message time { color: var(--ui-muted); font: 11px var(--mono); }
.main-flow .user-message { grid-template-columns: auto minmax(0, max-content); align-items: center; justify-content: end; column-gap: 8px; }
.main-flow .user-message > :not(time, .bubble) { grid-column: 2; }
.main-flow .day-divider { margin-bottom: 10px; }
.main-flow .exchange + .exchange { margin-top: 12px; }
.bubble {
  max-width: 100%; border: 1px solid var(--ui-line); border-radius: 10px 10px 3px 10px; padding: 6px 11px;
  background: var(--ui-surface); overflow-wrap: anywhere; font-size: 13px; white-space: pre-wrap;
}
.agent-message { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 9px; align-items: start; }
.agent-message + .agent-message { margin-top: 14px; }
.agent-name { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; margin-bottom: 4px; }
.agent-name strong { font-size: 12px; }
.agent-name time { color: var(--ui-muted); font: 10px var(--mono); }
.agent-copy { min-width: 0; }
.agent-copy > p { color: var(--ui-text-secondary); margin-bottom: 5px; font-size: 13px; }
.brief { border: 1px solid var(--ui-line); border-radius: 9px; overflow: hidden; }
.brief-row {
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
  padding: 4px 9px; min-height: 28px; background: var(--ui-panel); font-size: 12px;
}
.brief-row + .brief-row { border-top: 1px solid var(--ui-line); }
.brief-row .row { flex-wrap: wrap; gap: 5px 8px; min-width: 0; }
.brief-row .link { font-size: 11px; flex: none; }
.receipt, .plan, .record {
  border: 1px solid var(--ui-line); border-radius: 10px; background: var(--ui-panel); padding: 9px 11px;
}
.card-heading { display: flex; align-items: start; justify-content: space-between; gap: 7px; }
.card-heading h2, .card-heading h3 { font-size: 14px; }
.card-heading .icon { width: 17px; height: 17px; }
.card-heading .avatar { width: 29px; height: 29px; border-radius: 7px; }
.card-heading .title-stack { display: grid; gap: 3px; min-width: 0; }
.card-meta { gap: 5px; }
.ai-note {
  display: flex; align-items: center; gap: 6px; padding: 5px 7px; margin-top: 6px;
  border-radius: 6px; background: var(--ui-success-soft); color: var(--ui-success); font-size: 11px;
}
.ai-note svg { width: 15px; height: 15px; }
.card-actions { margin-top: 7px; }
.plan .card-heading { align-items: center; }
.plan-graph { display: grid; grid-template-columns: minmax(0,1fr) 22px minmax(0,1fr); align-items: stretch; gap: 4px; margin: 8px 0 0; }
.plan-node { display: grid; grid-template-columns: 22px minmax(0,1fr); align-items: start; gap: 6px; border: 1px solid var(--ui-line); background: var(--ui-surface); border-radius: 7px; padding: 6px 7px; }
.plan-node h3 { font-size: 11px; font-weight: 650; margin: 3px 0 0; }
.plan-node small { display: block; margin-top: 3px; font-size: 10px; color: var(--ui-text-secondary); }
.node-index {
  display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--ui-line); border-radius: 5px;
  background: var(--ui-panel); color: var(--ui-text-secondary); font: 11px var(--mono);
}
.plan-arrow { align-self: center; justify-self: center; color: var(--ui-muted); }

.composer-slot { flex: none; padding: 9px 26px 16px; }
.composer {
  position: relative; z-index: 1; margin: 0 auto; max-width: var(--content-width);
  border: 1px solid var(--ui-line); border-radius: 13px; background: var(--ui-panel);
  padding: 7px 9px 7px 12px; box-shadow: 0 2px 8px color-mix(in srgb,var(--ui-shadow) 5%,transparent);
}
.composer:focus-within { border-color: var(--ui-accent-line); }
.composer textarea { display: block; width: 100%; resize: none; min-height: 31px; max-height: 118px; overflow: auto; padding: 5px 1px; border: 0; outline: none; background: transparent; font-size: 13px; }
.composer textarea::placeholder { color: var(--ui-muted); }
.composer .send { background: var(--ui-accent); color: var(--ui-accent-on); border-radius: 50%; cursor: pointer; }
.composer .send:hover { background: var(--ui-accent-hover); }
.composer .send svg { width: 17px; height: 17px; }
.composer .tools { gap: 1px; }
.composer .tools .btn { padding-inline: 5px; font-size: 11px; min-height: 29px; }
.override {
  position: absolute; z-index: 3; bottom: calc(100% + 7px); left: 0; width: min(286px, 100%);
  border: 1px solid var(--ui-line); border-radius: 10px; background: var(--ui-raised); padding: 12px;
  box-shadow: 0 3px 13px color-mix(in srgb,var(--ui-shadow) 10%,transparent);
}
.override label, .draft-form label { display: grid; gap: 4px; font-size: 12px; color: var(--ui-text-secondary); }
.override label + label, .draft-form label + label { margin-top: 9px; }
.attachments { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.attachments:empty { display: none; }
.attachment { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--ui-line); border-radius: 6px; padding: 1px 5px; font-size: 11px; overflow-wrap: anywhere; max-width: 100%; }
.attachment img { width: 24px; height: 24px; object-fit: cover; border-radius: 4px; }
.attachment button { padding: 0; width: 24px; height: 24px; }
.message-overrides { justify-content: end; }

.thread-flow { padding-top: 17px; }
.thread-flow > .user-message { margin-bottom: 15px; }
.thread-flow .record { padding: 11px 12px; }
.thread-flow .record p { margin: 6px 0; color: var(--ui-text-secondary); font-size: 12px; }
.record.approval-record { background: color-mix(in srgb,var(--ui-warn-soft) 53%,var(--ui-panel)); border-color: var(--warm-line); }
.record .record-foot { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--ui-line); font-size: 11px; }
.checklist { list-style: none; padding: 0; margin: 7px 0 0; }
.checklist li { display: flex; align-items: start; gap: 6px; padding: 3px 0; font-size: 12px; }
.checklist svg { color: var(--ui-success); width: 14px; height: 14px; margin-top: 2px; }
.drawer {
  min-width: 0; min-height: 0; display: flex; flex-direction: column; z-index: 4;
  border-left: 1px solid var(--ui-line); background: var(--ui-panel);
  animation: slide-in 150ms ease-out;
}
@keyframes slide-in { from { opacity: .55; clip-path: inset(0 0 0 6px); } to { opacity: 1; clip-path: inset(0); } }
.drawer-head { padding: 14px 15px; border-bottom: 1px solid var(--ui-line); }
.drawer-head h2 { font-size: 16px; margin: 5px 0; }
.drawer-body { padding: 0 15px; }
.drawer-section { padding: 13px 0; }
.drawer-section + .drawer-section { border-top: 1px solid var(--ui-line); }
.drawer-section h3 { font-size: 13px; }
.drawer-section > p { margin-top: 5px; font-size: 12px; color: var(--ui-text-secondary); }
.evidence { padding: 7px 0 0; }
.evidence-row { padding: 6px 0; }
.evidence-row + .evidence-row { border-top: 1px solid var(--ui-line); }
.evidence-row strong { font-size: 12px; }
.evidence-row p { margin-top: 3px; font-size: 11px; color: var(--ui-text-secondary); }
.meter-summary { margin: 6px 0; font-size: 11px; }
.run-row { display: flex; justify-content: space-between; gap: 6px; padding: 4px 0; font-size: 11px; color: var(--ui-text-secondary); }
.log { margin-top: 8px; padding: 7px; border: 1px solid var(--ui-line); border-radius: 7px; background: var(--ui-surface); white-space: pre-wrap; overflow-wrap: anywhere; font: 10.5px/1.6 var(--mono); }
.drawer-footer { padding: 11px 13px; border-top: 1px solid var(--ui-line); }
.drawer-footer .btn { flex: 1 0 auto; }
.scrim { display: none; }

.inbox-scroll { padding: 20px 26px; background: var(--ui-bg); }
.inbox-content { max-width: var(--content-width); margin-inline: auto; }

    return '<section class="board-column"><header><span class="dot ' + color + '"></span><h2>' + title +
      '</h2><span class="count">' + items.length + '</span></header>' +
      (items.length ? items.map((item) =>
        '<button type="button" class="board-card" data-action="drawer" data-value="' + item.id + '" aria-expanded="' + (drawer === item.id) +
        '"><span class="row between">' + ticketId(item.id) + icon("panel") + '</span><strong>' + item.title + '</strong><span class="row">' +
        projectTag(item.project) + (item.state === "queued" ? status(item) : "") + '</span><span class="row muted">' +
        item.source + ' <span aria-hidden="true">·</span> ' + (item.rounds ? '第 ' + item.rounds + ' 轮' : '等待首轮') +
        '</span></button>').join("") : '<p class="sidebar-empty">暂无工单</p>') + '</section>';
  }).join("") + '</div><section class="ops-plans"><div class="row between section-title"><h2>活跃协作计划</h2>' +
    link("tab", "查看计划", "plans") + '</div>' + activePlans() + '</section>';
}
function flowView() {
  const nodes = [
    ["plug", "触发器", "桌面、飞书、GitHub 与定时", "私聊经 Router · 外部来源发标准事件"],
    ["chat", "Thread 讨论串", "消息、答复和卡片回到原话题", "已绑定事项直通原执行会话"],
    ["ticket", "Ticket 工单", "Hub 按可信规则开单与派发", "状态来自事实日志"],
    ["term", "Worker 会话", "在项目沙箱执行并提交回执", "需本人决定时发卡并结束本轮"],
  ];
  return '<div class="section-title"><h2>从触发到交付</h2></div><div class="flow-map">' + nodes.map(([symbol, title, first, second], index) =>
    (index ? '<span class="plan-arrow">' + icon("right") + '</span>' : '') + '<div class="flow-node">' + icon(symbol) + '<strong>' +
    title + '</strong><small>' + first + '</small><small>' + second + '</small></div>').join("") + '</div><div class="wrap">' +
    link("navigate", "处理待办", "inbox") + link("tab", "查看工单", "board") + '</div>';
}
function opsView() {
  const content = {
    board: () => board(),
    plans: () => '<div class="section-title"><h2>活跃协作计划</h2></div>' + activePlans() +
      (upNext.state === "draft" ? '<section class="ops-plans"><div class="section-title"><h2>待确认计划</h2></div>' + planCard() + '</section>' : ""),
    flow: () => flowView(),
  }[tab]();
  return header("运行", "Mission Control · 查看工单状态与跨项目依赖", { leading: avatar("ops", "large plain") }) +
    '<div id="main-scroll" class="scroller ops-scroll"><div class="ops-content"><div class="ops-tabs" role="group" aria-label="运行视图">' +
    Object.entries(tabs).map(([key, label]) => action("tab", label, "", key, "", ' aria-pressed="' + (tab === key) + '"')).join("") +
    '</div>' + content + '</div></div>';
}


function capabilitiesSidebar() {
  return '<aside id="sidebar" class="sidebar cap-sidebar' + (sideOpen ? ' is-open' : '') + '" aria-label="能力与沙箱分类">' +
    '<h2>能力与沙箱</h2><nav class="cap-nav" aria-label="配置分类">' +
    Object.entries(groups).map(([key, [label, symbol]]) =>
      action("group", key === "territory" ? "项目领地（沙箱）" : label, "", key, symbol, current(group === key))).join("") + '</nav></aside>';
}
function territories() {
  return Object.entries(projects).map(([id, project]) =>
    '<article class="territory"><div class="card-heading"><div class="row">' + avatar(project.icon, id === "ajinos" ? "" : "plain") +
    '<div class="title-stack"><h2>' + project.name + '</h2><p>' + project.description + '</p></div></div>' +
    button("edit-profile", "更新画像 / 规则", "", id) + '</div><dl class="territory-fields"><div><dt>工作目录</dt><dd class="mono">' +
    project.path + '</dd></div><div><dt>权限档位</dt><dd>' + chip(project.permission) +
    '</dd></div><div><dt>并发上限</dt><dd>' + project.limit + ' 轮</dd></div><div><dt>项目画像</dt><dd>' +
    (draftsConfig.has(id) ? chip("待应用草稿", "amber") : chip(project.profile, project.profile === "已更新" ? "green" : "amber")) +
    '</dd></div></dl></article>').join("");
}
const configuration = {
  roles: [
    ["dag", "规划 · Router", "新意图按需调用。只选择已登记的项目和流程。"],
    ["term", "执行 · Codex CLI", "从手动导入的配置中按可信规则选用。常规与深度配置分别指定模型和思考强度。"],
    ["check", "校验 · 独立验证", "复核结构化回执与测试证据，给出验收建议，最终由本人签收。"],
  ],
  memory: [
    ["history", "项目画像", "按项目记录目录用途、约定和交接背景。Worker 以只读资料引用相关内容。"],
    ["doc", "保留的协作事实", "已选审批、验收依据与交付结果可以回到原事项查询。"],
  ],
  sources: [
    ["chat", "飞书私聊", "与桌面共享 Router 和 Thread 绑定，答复回到原私聊。"],
    ["inbox", "飞书群采集", "采集事件走来源插件，审批进入待我处理。"],
    ["plug", "GitHub Issue", "Issue 变动以标准事件进入 Hub，可回到来源与对应事项。"],
  ],
};
function capabilitiesView() {
  const title = groups[group][0];
  const content = group === "territory" ? territories() : configuration[group].map(([symbol, label, description]) =>
    '<article class="territory"><div class="row">' + avatar(symbol, "plain") +
    '<div class="title-stack"><h2>' + label + '</h2><p>' + description + '</p></div></div></article>').join("");
  const descriptions = {
    territory: "Super Agent 的受控工作目录与权限边界",
    roles: "规划、执行与校验分别使用可信配置",
    memory: "按项目查阅长期资料",
    sources: "查看事件的来源与答复去向",
  };
  return header(title, descriptions[group], { leading: avatar(groups[group][1], "large plain"), menu: "打开配置分类" }) +
    '<div id="main-scroll" class="scroller cap-scroll"><div class="cap-content">' + content + '</div></div>';
}
function announce(message) {
  const toast = el("#toast");
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
}
function render({ preserveScroll = true } = {}) {
  const scroll = el("#main-scroll")?.scrollTop ?? 0;
  const detailsScroll = el(".drawer-body")?.scrollTop ?? 0;
  const sideScroll = el("#sidebar")?.scrollTop ?? 0;
  renderRail();
  const isChat = ["main", "thread", "inbox"].includes(state);
  const hasSidebar = isChat || state === "capabilities";
  const stage = el("#stage");
  stage.className = "stage" + (hasSidebar ? " has-sidebar" : "") + (drawer ? " has-drawer" : "");
  const view = { main: mainView, thread: threadView, inbox: inboxView, ops: opsView, capabilities: capabilitiesView }[state]();
  stage.innerHTML = (hasSidebar ? isChat ? sidebar() : capabilitiesSidebar() : "") + '<main class="workspace">' + view + '</main>' +
    (drawer ? '<button type="button" class="scrim drawer-scrim" aria-hidden="true" tabindex="-1" data-action="dismiss-drawer"></button>' +
      drawerView(byId(drawer)) : '') +
    (sideOpen ? '<button type="button" class="scrim sidebar-scrim" aria-hidden="true" tabindex="-1" data-action="side-menu"></button>' : '');
  const project = el("#project-filter");
  if (project) project.value = filters.project;
  const form = el("#composer");
  if (form) {
    const draft = getDraft(form.dataset.key);
    const projectSelect = el("#override-project");
    if (projectSelect) {
      projectSelect.value = draft.project;
      el("#override-model").value = draft.model;
    }
    resizeInput(form.querySelector("textarea"));
  }
  if (preserveScroll) {
    el("#main-scroll").scrollTop = scroll;
    if (drawer) el(".drawer-body").scrollTop = detailsScroll;
    if (hasSidebar) el("#sidebar").scrollTop = sideScroll;
  }
}
function getDraft(key) {
  if (!drafts.has(key)) drafts.set(key, { text: "", images: [], project: "", model: "" });
  return drafts.get(key);
}
function resizeInput(input) {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 118) + "px";
}
function setDrawer(id) {
  drawer = id;
  if (state === "thread") syncLocation("replaceState");
  render();
  if (drawer) el(".drawer-head button").focus({ preventScroll: true });
  else el('[data-action="drawer"]')?.focus({ preventScroll: true });
}
function applyTicket(id, stateAfter, outcome) {
  const item = byId(id);
  item.state = stateAfter;
  item.outcome = outcome;
  if (stateAfter === "running") item.rounds += 1;
  render();
  announce(outcome);
}
function startPlan() {
  if (upNext.state !== "draft") return;
  upNext.state = "running";
  tickets.push(
    { id: "T-000129", title: "核查超时重试日志与补测", project: "orders", time: "10:38", state: "running", source: "协作计划", rounds: 1, summary: "核对重试失败时是否保留订单号和异常原因，提交测试证据与只读结论。" },
    { id: "T-000130", title: "按上游结论同步更新接口说明", project: "docs", time: "10:38", state: "queued", source: "协作计划", rounds: 0, summary: "等待 T-000129 的只读结论，收到后生成接口说明修订建议。" },
  );
  render();
  announce("计划已启动 · 已创建 2 张工单");
}
function openDialog(kind, id) {
  modal = { kind, id };
  const dialog = el("#dialog");
  const isProfile = kind === "profile";
  const item = isProfile ? projects[id] : byId(id);
  const config = draftsConfig.get(id) ?? item;
  const verb = kind === "reject" ? "打回修改" : "关闭工单";
  dialog.innerHTML = '<form id="dialog-form"><h2 id="dialog-title">' + (isProfile ? "更新画像 / 规则" : verb) +
    '</h2><p>' + (isProfile ? item.name + ' · 先保存草稿，由本人应用。' : item.id + ' · ' + item.title) + '</p>' +
    '<div class="draft-form">' + (isProfile ? '<label>项目画像<textarea class="control" name="portrait" required>' + safe(config.portrait) +
      '</textarea></label><label>规则草稿<textarea class="control" name="rules" required>' + safe(config.rules) + '</textarea></label>' :
      '<label>' + (kind === "reject" ? "需要修改的内容" : "关闭原因") + '<textarea class="control" name="reason" required></textarea></label>') +
    '</div><div class="wrap queue-actions">' + button("dismiss-modal", "取消", "ghost") +
    '<button type="submit" class="btn primary">' + (isProfile ? "保存草稿" : "确认" + verb) + '</button></div></form>';
  dialog.setAttribute("aria-labelledby", "dialog-title");
  dialog.showModal();
}
function handleClick(event) {
  const target = event.target.closest("[data-action]");
  if (!target || target.disabled) return;
  const id = target.dataset.value;
  switch (target.dataset.action) {
    case "navigate": navigate(id); break;
    case "thread": navigate("thread", id); break;
    case "tab":
      tab = id;
      drawer = "";
      syncLocation();
      render({ preserveScroll: false });
      el('[data-action="tab"][aria-pressed="true"]').focus({ preventScroll: true });
      break;
    case "group":
      group = id;
      sideOpen = false;
      syncLocation();
      render({ preserveScroll: false });
      (el(".mobile-menu")?.offsetWidth ? el(".mobile-menu") : el('.cap-nav [aria-current]')).focus({ preventScroll: true });
      break;
    case "theme":
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      syncLocation("replaceState");
      renderRail();
      el('[data-action="theme"]').focus({ preventScroll: true });
      break;
    case "drawer": setDrawer(drawer === id ? "" : id); break;
    case "dismiss-drawer": setDrawer(""); break;
    case "side-menu":
      sideOpen = !sideOpen;
      render();
      (sideOpen ? el("#sidebar button") : el(".mobile-menu"))?.focus({ preventScroll: true });
      break;
    case "search": {
      filters.searching = !filters.searching;
      const input = el("#thread-search");
      input.hidden = !filters.searching;
      target.setAttribute("aria-expanded", String(filters.searching));
      if (filters.searching) input.focus();
      else {
        input.value = "";
        filters.search = "";
        el("#threads").innerHTML = threadList();
      }
      break;
    }
    case "filter":
      filters.status = id;
      for (const item of document.querySelectorAll("[data-action=filter]")) item.setAttribute("aria-pressed", String(item === target));
      el("#threads").innerHTML = threadList();
      break;
    case "override":
      overrideOpen = !overrideOpen;
      el("#overrides").hidden = !overrideOpen;
      target.setAttribute("aria-expanded", String(overrideOpen));
      target.setAttribute("aria-label", overrideOpen ? "收起高级覆盖" : "展开高级覆盖");
      if (overrideOpen) el("#override-project").focus();
      break;
    case "image": el("#images").click(); break;
    case "remove-image": {
      const draft = getDraft(el("#composer").dataset.key);
      URL.revokeObjectURL(draft.images[Number(id)].url);
      draft.images.splice(Number(id), 1);
      render();
      el('[data-action="image"]').focus({ preventScroll: true });
      break;
    }
    case "accept":
      if (byId(id).state === "review") applyTicket(id, "closed", "本人已通过验收并关单");
      break;
    case "reject": openDialog("reject", id); break;
    case "close-ticket": openDialog("close-ticket", id); break;
    case "edit-profile": openDialog("profile", id); break;
    case "dismiss-modal": el("#dialog").close(); break;
    case "start-plan": startPlan(); break;
    case "cancel-plan":
      if (upNext.state === "draft") {
        upNext.state = "cancelled";
        render();
        announce("草案已取消");
      }
      break;
  }
}
function sendMessage(form) {
  const key = form.dataset.key;
  const draft = getDraft(key);
  const text = draft.text.trim();
  if (!text && !draft.images.length) {
    form.querySelector("textarea").focus();
    return;
  }
  const options = [];
  if (draft.project) options.push("本次项目 · " + projects[draft.project].name);
  if (draft.model) options.push("本次模型 · " + (draft.model === "codex" ? "Codex 常规" : "Codex 深度"));
  const reply = key === "main" ?
    /进度|哪几件事|需要我管|待办/.test(text) ? "digest" : "消息已加入演示对话。可以输入「今天有哪些待办」查看只读简报。" :
    "消息已加入当前 Thread。原事项绑定继续保留。";
  const list = messages.get(key) ?? [];
  list.push({ text, time: recentTime(), images: draft.images, options, reply });
  messages.set(key, list);
  drafts.delete(key);
  overrideOpen = false;
  render();
  const scroll = el("#main-scroll");
  scroll.scrollTop = scroll.scrollHeight;
  el("#composer textarea").focus({ preventScroll: true });
}

document.addEventListener("click", (event) => {
  handleClick(event);
  if (overrideOpen && !event.target.closest("#composer")) {
    overrideOpen = false;
    if (el("#overrides")) {
      el("#overrides").hidden = true;
      el("#override-toggle").setAttribute("aria-expanded", "false");
      el("#override-toggle").setAttribute("aria-label", "展开高级覆盖");
    }
  }
});
document.addEventListener("input", (event) => {
  const target = event.target;
  if (target.id === "thread-search") {
    filters.search = target.value;
    el("#threads").innerHTML = threadList();
  }
  if (target.matches("#composer textarea")) {
    getDraft(el("#composer").dataset.key).text = target.value;
    resizeInput(target);
  }
});
document.addEventListener("change", (event) => {
  const target = event.target;
  const form = target.form;
  if (target.id === "project-filter") {
    filters.project = target.value;
    el("#threads").innerHTML = threadList();
  }
  if (target.id === "override-project") getDraft("main").project = target.value;
  if (target.id === "override-model") getDraft("main").model = target.value;
  if (target.id === "images") {
    getDraft(form.dataset.key).images.push(...Array.from(target.files).filter((file) => file.type.startsWith("image/"))
      .map((file) => ({ name: file.name, url: URL.createObjectURL(file) })));
    render();
    el('[data-action="image"]').focus({ preventScroll: true });
  }
  if (form?.dataset.approval) {
    approvals.set(form.dataset.approval, target.value);
    for (const approval of document.querySelectorAll('form[data-approval="' + form.dataset.approval + '"]')) {
      approval.querySelector('input[value="' + target.value + '"]').checked = true;
      approval.querySelector('button[type="submit"]').disabled = false;
    }
  }
});
document.addEventListener("submit", (event) => {
  const form = event.target;
  event.preventDefault();
  if (form.id === "composer") sendMessage(form);
  if (form.dataset.approval) {
    const id = form.dataset.approval;
    const picked = approvals.get(id);
    if (picked && byId(id).state === "approval") {
      approvals.delete(id);
      applyTicket(id, picked === "decline" ? "closed" : "running", "本人已拍板 · " + approvalOptions[picked]);
    }
  }
  if (form.id === "dialog-form") {
    const { kind, id } = modal;
    const data = new FormData(form);
    const value = (name) => String(data.get(name)).trim();
    if (kind === "profile" && value("portrait") && value("rules")) {
      draftsConfig.set(id, { portrait: value("portrait"), rules: value("rules") });
      el("#dialog").close();
      render();
      el('[data-action="edit-profile"][data-value="' + id + '"]').focus({ preventScroll: true });
      announce("画像草稿已保存");
    } else if (kind !== "profile" && value("reason")) {
      el("#dialog").close();
      if (kind === "reject") applyTicket(id, "running", "已打回修改 · " + value("reason"));
      else applyTicket(id, "closed", "本人已关闭工单 · " + value("reason"));
    } else {
      announce("请填写内容");
    }
  }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.target.matches("#composer textarea")) {
    event.preventDefault();
    event.target.form.requestSubmit();
  }
  if (event.key !== "Escape" || el("#dialog").open) return;
  if (overrideOpen) {
    el("#override-toggle").click();
    el("#override-toggle").focus();
  } else if (sideOpen) {
    el(".mobile-menu").click();
  } else if (drawer) {
    setDrawer("");
  }
});
window.addEventListener("popstate", () => {
  readLocation();
  render({ preserveScroll: false });
});
readLocation();
render();
</script>
</body>
</html>
