<!doctype html>
<html lang="zh-CN" data-theme="light" data-variant="composer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJinOS · 工作台</title>
<style>
/* Theme tokens from client/src/theme.css and shell styles from the Super Agent design. */
:root {
  --ui-rail: #eef0f6;
  --ui-surface: #f4f6fa;
  --ui-bg: #f9fafc;
  --ui-panel: #ffffff;
  --ui-raised: #ffffff;
  --ui-line: #e2e6f0;
  --ui-wire: #bfc7da;
  --ui-text: #171c28;
  --ui-secondary: var(--ui-text-secondary);
  --ui-text-secondary: #475166;
  --ui-muted: #747f96;
  --ui-accent: #4f6ae8;
  --ui-accent-on: #ffffff;
  --ui-accent-ink: #3b53cc;
  --ui-soft: #e9eefd;
  --ui-success: #168a5b;
  --ui-success-soft: #e7f7ef;
  --ui-warn: #b4690e;
  --ui-warn-soft: #fdf3e3;
  --ui-danger: #c93b44;
  --ui-danger-soft: #fdecef;
  --ui-neutral-badge: #646e82;
  --ui-neutral-badge-soft: #eceff5;
  --ui-accent-hover: #3f58d6;
  --ui-accent-active: #3349bd;
  --ui-accent-line: #7a91f2;
  --ui-overlay: #161924;
  --ui-shadow: #171c28;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ui-rail: #11131c;
  --ui-surface: #161924;
  --ui-bg: #1b1f2c;
  --ui-panel: #212636;
  --ui-raised: #272d40;
  --ui-line: #2e354a;
  --ui-wire: #444e6b;
  --ui-text: #e8ecf7;
  --ui-secondary: var(--ui-text-secondary);
  --ui-text-secondary: #b4bed6;
  --ui-muted: #7d88a3;
  --ui-accent: #7aa2f7;
  --ui-accent-on: #101524;
  --ui-accent-ink: #8db1fa;
  --ui-soft: #252e47;
  --ui-success: #34d399;
  --ui-success-soft: #18352c;
  --ui-warn: #f2b84b;
  --ui-warn-soft: #3a2e1b;
  --ui-danger: #f87171;
  --ui-danger-soft: #3b2026;
  --ui-neutral-badge: #8b95b0;
  --ui-neutral-badge-soft: #252a3a;
  --ui-accent-hover: #8db1fa;
  --ui-accent-active: #658ee8;
  --ui-accent-line: #5d82d6;
  --ui-overlay: #10131c;
  --ui-shadow: #10131c;
  color-scheme: dark;
}
:root {
  --rail-width: 52px;
  --drawer-width: 368px;
  --warm-line: color-mix(in srgb, var(--ui-warn) 20%, var(--ui-line));
  --cool-line: color-mix(in srgb, var(--ui-accent) 24%, var(--ui-line));
  --mono: "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; color: var(--ui-text); background: var(--ui-panel);
  font: 14px/1.55 "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .58; }
:where(button, input, select, textarea, summary):focus-visible { outline: 2px solid var(--ui-accent-line); outline-offset: 2px; }
:where(h1, h2, h3, p, dl, dd, pre, fieldset) { margin: 0; }
:where(h1, h2, h3) { line-height: 1.35; }
small { font-size: 12px; }
svg.icon { width: 18px; height: 18px; flex: none; }
svg.symbols { position: absolute; width: 0; height: 0; pointer-events: none; }
.muted { color: var(--ui-muted); }
.secondary { color: var(--ui-text-secondary); }
.mono { font-family: var(--mono); }
.row, .wrap { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.dot { display: inline-block; width: 7px; height: 7px; flex: none; border-radius: 50%; background: currentColor; }
.dot.live { color: var(--ui-success); }
.chip {
  display: inline-flex; align-items: center; gap: 5px; width: max-content; max-width: 100%;
  padding: 2px 7px; border-radius: 5px; background: var(--ui-surface);
  color: var(--ui-text-secondary); font-size: 11px; line-height: 1.5;
}
.chip svg { width: 13px; height: 13px; }
.chip.amber { color: var(--ui-warn); background: var(--ui-warn-soft); }
.chip.green { color: var(--ui-success); background: var(--ui-success-soft); }
.chip.blue { color: var(--ui-accent-ink); background: var(--ui-soft); }
.chip.neutral { color: var(--ui-text-secondary); background: var(--ui-neutral-badge-soft); }
.btn, .icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--ui-line); border-radius: 7px; background: var(--ui-panel);
  padding: 5px 11px; min-height: 31px; font-size: 12px; font-weight: 600;
}
.btn:hover:not(:disabled), .icon-btn:hover:not(:disabled) { background: var(--ui-surface); }
.btn.primary { color: var(--ui-accent-on); background: var(--ui-accent); border-color: var(--ui-accent); }
.btn.primary:hover:not(:disabled) { background: var(--ui-accent-hover); border-color: var(--ui-accent-hover); }
.btn.ghost, .icon-btn { border-color: transparent; background: transparent; }
.btn.ghost { color: var(--ui-text-secondary); }
.btn.danger { color: var(--ui-danger); }
.btn svg { width: 15px; height: 15px; }
.icon-btn { width: 32px; height: 32px; padding: 0; color: var(--ui-text-secondary); }
.link {
  display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none;
  color: var(--ui-accent-ink); font-size: inherit; text-align: left;
}
.link svg { width: 13px; height: 13px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

.app { display: grid; grid-template-columns: var(--rail-width) minmax(0, 1fr); height: 100dvh; }
.rail { z-index: 6; background: var(--ui-rail); border-right: 1px solid var(--ui-line); }
.rail, .rail nav, .rail-foot { display: flex; flex-direction: column; align-items: center; }
.rail nav { gap: 9px; }
.rail-foot { gap: 14px; margin: auto 0 18px; }
.brand { margin: 15px 0 19px; width: 34px; height: 34px; color: var(--ui-accent-ink); }
.brand svg { width: 25px; height: 25px; }
.rail-button { position: relative; width: 36px; height: 36px; border-radius: 9px; }
.rail-button svg { width: 20px; height: 20px; }
.rail-button[aria-current] { color: var(--ui-accent-ink); background: var(--ui-soft); }
.rail-button[aria-current]::before {
  content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 2px;
  background: var(--ui-accent); border-radius: 0 2px 2px 0;
}
.rail-count {
  position: absolute; top: -5px; right: -4px; min-width: 17px; height: 17px; padding: 0 3px;
  border: 1px solid var(--ui-rail); border-radius: 9px; background: var(--ui-warn-soft); color: var(--ui-warn);
  font-size: 10px; line-height: 15px; text-align: center; font-weight: 750;
}
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip); position: absolute; z-index: 1; left: calc(100% + 9px); top: 50%;
  transform: translateY(-50%); opacity: 0; visibility: hidden; pointer-events: none;
  padding: 4px 8px; border-radius: 5px; background: var(--ui-raised); border: 1px solid var(--ui-line);
  color: var(--ui-text); font-size: 12px; font-weight: 500; white-space: nowrap;
}
[data-tooltip]:is(:hover, :focus-visible)::after { visibility: visible; opacity: 1; }
.rail-engine { display: grid; place-items: center; width: 24px; height: 15px; }
.engine {
  display: inline-flex; align-items: center; flex: none; gap: 6px; border: 1px solid var(--ui-line);
  padding: 4px 9px; border-radius: 50px; color: var(--ui-text-secondary); font-size: 11px; white-space: nowrap;
}
.engine .dot { width: 6px; height: 6px; }
.drawer-head { padding: 14px 15px; border-bottom: 1px solid var(--ui-line); }
.drawer-head h2 { font-size: 16px; margin: 5px 0; }
.drawer-body { padding: 0 15px; }
.drawer-section { padding: 13px 0; }
.drawer-section + .drawer-section { border-top: 1px solid var(--ui-line); }
.drawer-section h3 { font-size: 13px; }
.drawer-section > p { margin-top: 5px; font-size: 12px; color: var(--ui-text-secondary); }
.evidence { padding: 7px 0 0; }
.evidence-row { padding: 6px 0; }
.evidence-row + .evidence-row { border-top: 1px solid var(--ui-line); }
.evidence-row strong { font-size: 12px; }
.evidence-row p { margin-top: 3px; font-size: 11px; color: var(--ui-text-secondary); }
.meter-summary { margin: 6px 0; font-size: 11px; }
.run-row { display: flex; justify-content: space-between; gap: 6px; padding: 4px 0; font-size: 11px; color: var(--ui-text-secondary); }
.log { margin-top: 8px; padding: 7px; border: 1px solid var(--ui-line); border-radius: 7px; background: var(--ui-surface); white-space: pre-wrap; overflow-wrap: anywhere; font: 10.5px/1.6 var(--mono); }
.drawer-footer { padding: 11px 13px; border-top: 1px solid var(--ui-line); }
.drawer-footer .btn { flex: 1 0 auto; }

body { background: var(--ui-bg); }
.avatar {
  display: grid; place-items: center; flex: none; width: 30px; height: 30px;
  border-radius: 8px; background: var(--ui-soft); color: var(--ui-accent-ink);
}
.avatar.plain { background: var(--ui-surface); color: var(--ui-text-secondary); }
.avatar.checked { background: var(--ui-success-soft); color: var(--ui-success); }
.avatar.amber { background: var(--ui-warn-soft); color: var(--ui-warn); }
.shell { display: grid; grid-template-rows: 52px minmax(0, 1fr); min-width: 0; min-height: 0; }
.topbar {
  z-index: 5; display: flex; align-items: center; gap: 14px; min-width: 0;
  padding: 0 clamp(14px, 2vw, 28px); background: var(--ui-panel); border-bottom: 1px solid var(--ui-line);
}
.topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: -.25px; white-space: nowrap; }
.top-controls { display: flex; align-items: center; gap: 9px; min-width: 0; margin-left: auto; }
.segmented {
  display: inline-flex; flex: none; align-items: center; gap: 2px; padding: 2px;
  border: 1px solid var(--ui-line); border-radius: 8px; background: var(--ui-surface);
}
.segmented button {
  min-height: 24px; padding: 2px 9px; border: 1px solid transparent; border-radius: 5px;
  background: transparent; color: var(--ui-text-secondary); font-size: 11px; white-space: nowrap;
}
.segmented button:hover { color: var(--ui-accent-ink); }
.segmented button[aria-pressed="true"] {
  color: var(--ui-accent-ink); background: var(--ui-panel); border-color: var(--ui-line); font-weight: 650;
}
.variants, .variants button { border-radius: 50px; }
.pending {
  display: inline-flex; align-items: center; flex: none; gap: 6px; padding: 4px 9px; border-radius: 50px;
  background: var(--ui-warn-soft); color: var(--ui-warn); border: 1px solid var(--warm-line);
  font-size: 11px; white-space: nowrap;
}
.pending:hover { border-color: var(--ui-warn); }
.pending .icon { width: 13px; height: 13px; }
kbd { font: 10.5px/1.3 var(--mono); }
.top-send { white-space: nowrap; }
.top-send kbd { margin-left: 3px; opacity: .86; }
.stage { display: grid; position: relative; min-height: 0; min-width: 0; grid-template-columns: minmax(0, 1fr) 0px; transition: grid-template-columns 220ms ease; }
.stage.has-drawer { grid-template-columns: minmax(0, 1fr) var(--drawer-width); }
.workspace { min-width: 0; min-height: 0; overflow: auto; container-type: inline-size; }
.home { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; min-height: 608px; padding: 0 clamp(16px, 2.3cqw, 34px); }
.overview-heading {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: clamp(13px, 2.4vh, 24px) 1px clamp(12px, 2vh, 20px);
}
.overview-heading h2 { font-size: 23px; font-weight: 700; letter-spacing: -.55px; }
.overview-heading p { margin-top: 3px; font-size: 12px; color: var(--ui-text-secondary); }
.overview-stats { gap: 0; }
.overview-stat {
  display: flex; align-items: center; gap: 7px; padding: 3px 12px; border: 0; background: transparent;
  color: var(--ui-text-secondary); font-size: 11px; white-space: nowrap;
}
.overview-stat:last-child { padding-right: 0; }
.overview-stat + .overview-stat { border-left: 1px solid var(--ui-line); }
.overview-stat .icon { width: 14px; height: 14px; color: var(--ui-accent-ink); }
.overview-stat strong { color: var(--ui-text); font-size: 13px; }
.overview-stat:hover { color: var(--ui-accent-ink); }
.canvas {
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0;
  border: 1px solid var(--ui-line); border-radius: 12px; background: var(--ui-panel);
}
.flow-columns {
  display: grid; grid-template-columns: minmax(0,.83fr) minmax(0,1.13fr) minmax(0,1.21fr) minmax(0,1.1fr);
  column-gap: clamp(28px,4.3cqw,61px); padding-inline: clamp(18px, 2.15cqw, 32px);
}
.lane-head { padding-block: 14px 12px; border-radius: 12px 12px 0 0; }
.lane-title { display: flex; align-items: center; gap: 8px; min-width: 0; border-bottom: 1px solid var(--ui-line); padding-bottom: 10px; }
.lane-title .icon { width: 16px; height: 16px; color: var(--ui-accent-ink); }
.lane-title:last-child .icon { color: var(--ui-warn); }
.lane-title h3 { font-size: 13px; font-weight: 650; }
.lane-title p { font-size: 10.5px; line-height: 1.35; color: var(--ui-text-secondary); }
.flow-body {
  position: relative; align-items: center; min-width: 0;
  background-color: color-mix(in srgb, var(--ui-bg) 68%, var(--ui-panel));
  background-image: radial-gradient(var(--ui-line) .68px, transparent .68px);
  background-size: 18px 18px; background-position: center;
}
.lane { display: flex; flex-direction: column; gap: 10px; min-width: 0; z-index: 1; }
.source-lane { transform: translateY(-43px); }
.result-lane { transform: translateY(-12px); }
.card {
  min-width: 0; width: 100%; text-align: left; border: 1px solid var(--ui-line); border-radius: 9px;
  background: var(--ui-panel); color: var(--ui-text);
  box-shadow: 0 2px 8px color-mix(in srgb, var(--ui-shadow) 3%, transparent);
  transition: border-color 150ms, background-color 150ms, box-shadow 150ms;
}
button.card:hover, .node-action:hover { border-color: var(--ui-accent-line); }
.node-action { transition: background-color 150ms, border-color 150ms; }
.node-action:hover { background: var(--ui-surface); }
.card.on-path, .node-action.on-path { border-color: var(--ui-accent-line); background: color-mix(in srgb, var(--ui-panel) 86%, var(--ui-soft)); }
.card.on-path { box-shadow: 0 0 0 2px color-mix(in srgb, var(--ui-accent) 9%, transparent); }
.node-row { display: flex; align-items: center; gap: 8px; padding: 8px 9px; min-height: 47px; }
.node-copy { display: grid; gap: 2px; min-width: 0; }
.node-copy strong { font-size: 12px; font-weight: 650; line-height: 1.35; }
.node-copy small { font-size: 10.5px; color: var(--ui-text-secondary); line-height: 1.35; }
.source-card { min-height: 54px; }
.source-card .avatar svg, .project-card .avatar svg { width: 16px; height: 16px; }
.source-card .node-meta { display: flex; align-items: center; gap: 5px; }
.source-card .dot { width: 5px; height: 5px; }
.source-card .count { color: var(--ui-accent-ink); font: 12px var(--mono); }
.source-card .count.idle { color: var(--ui-muted); }
.router-lane { gap: 19px; }
.router-card { border-color: var(--cool-line); box-shadow: 0 4px 13px color-mix(in srgb, var(--ui-shadow) 5%, transparent); }
.router-head, .result-head { display: flex; align-items: center; gap: 8px; text-align: left; width: 100%; min-width: 0; padding: 8px 10px; background: transparent; border: 1px solid transparent; }
.router-head { border-radius: 8px 8px 0 0; background: color-mix(in srgb, var(--ui-soft) 39%, var(--ui-panel)); border-bottom-color: var(--cool-line); }
.router-head .avatar { width: 33px; height: 33px; }
.router-head .avatar svg { width: 21px; height: 21px; }
.router-head strong { font-size: 14px; }
.router-head > .dot { width: 6px; height: 6px; margin-left: auto; }
.router-inner { display: grid; gap: 6px; padding: 7px; }
.route {
  display: grid; width: 100%; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 3px 4px;
  text-align: left; min-width: 0; min-height: 44px; padding: 5px 7px;
  background: var(--ui-surface); border: 1px solid var(--ui-line); border-radius: 7px;
}
.route strong { font-size: 11.5px; font-weight: 650; }
.route .path-icon { width: 13px; height: 13px; color: var(--ui-accent-ink); }
.route.fast .path-icon { color: var(--ui-success); }
.route .chip { font-size: 10px; padding-inline: 5px; }
.route > small { grid-column: 1 / -1; color: var(--ui-text-secondary); font-size: 10.5px; line-height: 1.25; }
.router-plan { min-height: 72px; padding: 7px 8px; background: var(--ui-panel); }
.router-plan .row { gap: 5px; }
.router-plan .plan-name { min-width: 0; font-size: 11px; font-weight: 600; color: var(--ui-text-secondary); }
.router-plan .progress-label { font: 11px var(--mono); color: var(--ui-accent-ink); white-space: nowrap; }
.bar, .plan-meter { display: flex; gap: 3px; }
.bar i, .plan-meter i { height: 4px; flex: 1; border-radius: 3px; background: var(--ui-line); }
.bar i.filled, .plan-meter i.filled { background: var(--ui-accent-line); }
.plan-meter { gap: 4px; margin-top: 7px; }
.plan-meter i.active { background: color-mix(in srgb, var(--ui-accent-line) 37%, var(--ui-line)); }
.hub { background: color-mix(in srgb, var(--ui-surface) 45%, var(--ui-panel)); }
.hub .avatar { width: 26px; height: 26px; }
.hub .avatar .icon { width: 16px; height: 16px; }
.hub .mono { font-size: 10px; color: var(--ui-text-secondary); }
.project-card { min-height: 49px; }
.project-card .node-copy small { display: flex; flex-wrap: wrap; align-items: baseline; gap: 1px 5px; }
.project-card .node-copy .mono { color: var(--ui-accent-ink); }
.node-chevron { width: 13px !important; height: 13px !important; color: var(--ui-muted); margin-left: auto; transform: rotate(-90deg); }
.workers { margin-top: 7px; }
.workers-head {
  display: flex; align-items: center; gap: 6px; width: 100%; padding: 7px 9px;
  background: transparent; border: 1px solid transparent; border-radius: 8px 8px 0 0; text-align: left;
  font-size: 11.5px; font-weight: 650;
}
.workers-head .icon { width: 15px; height: 15px; color: var(--ui-accent-ink); }
.worker-list { padding: 0 6px 5px; }
.worker {
  width: 100%; display: grid; grid-template-columns: minmax(0,.92fr) minmax(25px,1fr) auto;
  align-items: center; gap: 6px; min-height: 28px; padding: 3px 4px; border: 1px solid transparent;
  border-radius: 5px; background: transparent; text-align: left; font-size: 11px;
}
.worker + .worker { border-top-color: var(--ui-line); }
.worker .meter-label { font: 11px var(--mono); color: var(--ui-text-secondary); }
.worker .ready { color: var(--ui-success); font-size: 10.5px; white-space: nowrap; }
.worker.verify { grid-template-columns: minmax(0,1fr) auto; }
.worker.claude .bar i.filled { background: var(--ui-success); }
.result-head { min-height: 36px; padding: 5px 8px; border-radius: 8px 8px 0 0; }
.result-head .icon { width: 14px; height: 14px; }
.result-head strong { font-size: 12px; font-weight: 650; }
.result-head .chip { margin-left: auto; font: 11px var(--mono); }
.result-head.amber { color: var(--ui-warn); background: color-mix(in srgb, var(--ui-warn-soft) 38%, var(--ui-panel)); }
.result-head.blue { color: var(--ui-accent-ink); background: color-mix(in srgb, var(--ui-soft) 35%, var(--ui-panel)); }
.result-list { display: grid; gap: 2px; padding: 3px 5px 5px; }
.ticket-row {
  display: grid; width: 100%; min-width: 0; grid-template-columns: minmax(0,1fr) auto; align-items: center;
  gap: 5px; min-height: 47px; padding: 4px 5px; border: 1px solid transparent;
  border-radius: 6px; background: transparent; text-align: left;
}
.ticket-row .mono { font-size: 10px; color: var(--ui-text-secondary); }
.ticket-row strong { font-size: 12px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.ticket-row .icon { color: var(--ui-muted); width: 13px; height: 13px; }
.signed { min-height: 51px; }
.signed .count { color: var(--ui-success); margin-left: auto; font: 15px var(--mono); }
.empty-row { color: var(--ui-text-secondary); font-size: 11px; padding: 9px 5px; }

.wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0; }
.wire { fill: none; stroke: var(--ui-wire); stroke-width: 1.15; opacity: .85; }
.wire.router, .wire.fast { stroke: var(--ui-accent-line); opacity: .57; }
.wire.direct, .wire.receipt { stroke-dasharray: 3 3; }
.wire.receipt { stroke: var(--ui-success); opacity: .46; }
.wire.approval { stroke: var(--ui-warn); opacity: .50; }
.wires.tracking .wire:not(.hot), .wires.tracking .port:not(.hot) { opacity: .16; }
.wire.hot { stroke: var(--ui-accent-line); stroke-width: 1.7; opacity: 1; }
.wire.hot:is(.direct, .receipt, .fast, .worker-link) { stroke: var(--ui-success); }
.port { fill: var(--ui-panel); stroke: var(--ui-wire); stroke-width: 1.1; }
.port.hot { stroke: var(--ui-accent-line); }
.port.hot:is(.direct, .receipt, .fast, .worker-link) { stroke: var(--ui-success); }
.packet { fill: var(--ui-accent); stroke: var(--ui-panel); stroke-width: 1; }
.packet:is(.direct, .receipt, .fast, .worker-link) { fill: var(--ui-success); }

.map-footer { min-height: 36px; padding: 4px clamp(13px, 2cqw, 30px); border-top: 1px solid var(--ui-line); border-radius: 0 0 12px 12px; font-size: 10.5px; color: var(--ui-text-secondary); }
.legend { flex-wrap: wrap; gap: 7px 16px; }

.track-caption { gap: 5px; min-width: 0; flex-wrap: wrap; color: var(--ui-accent-ink); }

.dock {

}
.composer {

.composer .send { width: 32px; height: 32px; flex: none; border-radius: 50%; padding: 0; }
.composer .send svg { width: 17px; height: 17px; }
.composer .attachment { max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.dock .track-control { grid-column: 3; justify-self: end; }
.track-control {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; white-space: nowrap;

.popover {
  position: absolute; z-index: 3; min-width: 210px; padding: 7px; border: 1px solid var(--ui-line);

}
.track-menu { bottom: calc(50% + 21px); right: 0; }
.track-menu .ticket-row { min-height: 34px; }
.option-wrap { position: relative; flex: none; }
.override-menu { bottom: calc(100% + 12px); left: 0; }
dialog .override-menu { bottom: auto; top: calc(100% + 12px); }
.override-menu label { display: grid; gap: 6px; padding: 3px; font-size: 12px; }
.override-menu select, .approval-options select { padding: 5px; border: 1px solid var(--ui-line); border-radius: 7px; background: var(--ui-panel); }
.activity {

}

.activity-chip {

    `<div class="evidence-row"><div class="row">${chip("通过", "green")}<strong>${criterion}</strong></div><p>${proof}</p></div>`).join("");
  const approval = item.state === "approval" ? panelSection("本人拍板",
    '<p>本次演示可让原事项继续只读预检，或拒绝这项请求。</p><label class="approval-options">审批决定<select id="approval-decision"><option value="read">只执行只读预检</option><option value="decline">拒绝执行</option></select></label>') : "";
  const trace = [
    [item.time, item.route === "direct" ? "source.event.accepted" : "thread.message.bound"],
    [item.time, item.state === "approval" ? "card.opened · askFirst" : "ticket.opened · " + item.id],
    item.worker ? [item.time, item.state === "running" ? "run.claimed · " + item.worker : "run.receipt · " + item.worker] : [],
    item.decision ? [item.time, "card.answered · " + item.decision] : [],
    item.state === "closed" ? [item.time, "ticket.closed · 本人签收"] : [],
  ].filter(entry => entry.length).map(entry => entry.join("  ")).join("\n");
  return {
    key: item.id, title: item.title,
    badges: chip(project.name) + statusChip(item),
    body: panelSection("当前进展", `<p>${item.summary}</p><div class="run-row"><span>来源</span><strong>${sources[item.source].name}</strong></div>`) +
      (evidence ? panelSection("验收标准逐项依据", `<div class="evidence">${evidence}</div>`) : "") + approval +
      panelSection("执行轮次与权限", `<div class="run-row"><span>已派发轮次</span><strong>${item.state === "waiting" ? 0 : item.rounds || 1}</strong></div>
        <div class="run-row"><span>项目权限</span><strong class="mono">${project.permission}</strong></div>
        ${item.worker ? `<div class="run-row"><span>执行器</span><strong>${workers[item.worker].name}</strong></div>` : ""}`) +
      panelSection("<code>why</code> 事实与输出日志", `<pre class="log">${trace}</pre>`),
    actions: btn(`data-thread="${item.id}"`, "进入原 Thread", "right") +
      (item.state === "review" ? btn(`data-accept="${item.id}"`, "通过验收", "check", "primary") :
        item.state === "approval" ? btn(`data-answer="${item.id}"`, "提交决定", "check", "primary") :
        btn(`data-follow="${item.id}"`, "跟踪路径", "track", "primary")),
  };
}

function nodeDetails(id) {
  if (sources[id]) {
    const source = sources[id];
    return { key: "触发来源", title: source.name, badges: chip(source.route, "blue"),
      body: panelSection("入口规则", `<p>${source.note}</p>`) + panelSection("当前活跃", listDetails(pendingOf(id))) };
  }
  if (projects[id]) {
    const project = projects[id];
    return { key: "项目领地", title: project.name, badges: chip(project.permission, "blue"),
      body: panelSection("沙箱与可信规则", `<div class="details-table"><code>${project.path}</code></div><p>${project.rule}</p>`) +
        panelSection("执行中与待验收", listDetails(tickets.filter(item => item.project === id && ["running", "review"].includes(item.state)))) };
  }
  if (workers[id]) {
    const worker = workers[id];
    return { key: "共享执行器", title: worker.name, badges: worker.limit ? chip(`${activeSlots(id)} / ${worker.limit} 已占用`, "blue") : chip("就绪", "green"),
      body: panelSection("角色与边界", `<p>${worker.note}</p>`) + panelSection("当前执行轮次", listDetails(inState("running").filter(item => item.worker === id))) };
  }
  const copy = {
    router: ["总管路由", "AJinOS Router", "共用桌面与飞书私聊的消息去重、身份校验与话题绑定。派单目录、权限和执行器来自可信规则。"],
    fast: ["总管路由", "Fast Path", `已有 Thread 沿原事项续接。今日已发出 ${digestCount} 份零消耗简报，固定简报直接读取状态快照。`],
    slow: ["总管路由", "Slow Path", "全局问答原地回复。单项目明确目标提交标准事件。跨项目目标先发 DAG 计划卡，本人确认后拆单。"],
    hub: ["协议边界 /v1", "Hub 确定性内核", "统一收事件、匹配规则、派活并记录事实。GitHub Issue 与定时规则走标准事件，回执和人工决定关联原事项。"],
    memory: ["能力与沙箱", "长期记忆", "长期记忆通过项目隔离归档，作为只读资料提供给关联任务。"],
    plan: ["跨项目协作", planTitle, "已完成 1 / 3 步。订单系统正在核查超时重试日志。对外文档等待上游只读结论。"],
  };
  if (copy[id]) {
    const [key, title, detail] = copy[id];
    return { key, title, body: panelSection("当前状态", `<p>${detail}</p>`),
      actions: id === "plan" ? btn('data-go="dag"', "打开 DAG 协作计划", "dag", "primary") : "" };
  }
  const lists = { approval: "待拍板", review: "待验收", closed: "今日已本人签收", running: "运行中的工单" };
  if (lists[id]) return { key: "工单", title: lists[id], badges: chip(inState(id).length), body: listDetails(inState(id)) };
  const menus = {
    workers: ["共享执行器", workers], projects: ["项目领地", projects], sources: ["来源与通道", sources],
  };
  const [title, entries] = menus[id];
  return { key: "能力与沙箱", title, body: `<div class="evidence">${Object.entries(entries).map(([key, entry]) =>
    `<div class="evidence-row">${btn(`data-detail="${key}"`, entry.name, "right")}</div>`).join("")}</div>` };
}

function renderDrawer() {
  const stage = $("#stage");
  const slot = $("#drawer-slot");
  stage.classList.toggle("has-drawer", Boolean(drawer));
  slot.inert = !drawer;
  if (!drawer) return;
  const data = drawer.type === "ticket" ? ticketDetails(ticket(drawer.id)) : nodeDetails(drawer.id);
  const target = $("#drawer");
  target.innerHTML = `<header class="drawer-head"><div class="row between">
    <strong class="key ${drawer.type === "ticket" ? "mono" : ""}">${data.key}</strong>
    <button class="icon-btn" data-do="close-drawer" aria-label="关闭详情" title="关闭详情">${icon("close")}</button>
    </div><h2>${safe(data.title)}</h2>${data.badges ? `<div class="wrap">${data.badges}</div>` : ""}</header>
    <div class="drawer-body">${data.body}</div>${data.actions ? `<footer class="wrap drawer-footer">${data.actions}</footer>` : ""}`;
}

function routeFor(item) {
  if (!item) return flash;
  const nodes = [item.source, "hub", item.project];
  const edges = [item.source + "-" + item.route, "hub-" + item.project];
  if (item.route !== "direct") {
    nodes.push("router", item.route);
    edges.push("router-hub");
  }
  if (item.state === "approval") {
    nodes.push("approval");
    edges.push("ask");
  }
  if (item.worker) {
    nodes.push("workers", item.worker);
    edges.push(item.project + "-" + item.worker);
  }
  if (item.state === "review") {
    nodes.push("review");
    edges.push(item.worker + "-" + item.id);
  }
  if (item.state === "closed") {
    nodes.push("review", "closed");
    if (item.worker) edges.push(item.worker + "-review");
    edges.push("signoff");
  }
  return { nodes, edges };
}

function drawWires() {
  const field = $(".flow-body");
  if (!field) return;
  const svg = $(".wires", field);
  const fieldBounds = svg.getBoundingClientRect();
  const item = ticket(tracked);
  const trace = routeFor(item);
  const routes = [];
  const box = node => {
    const { left, right, top, bottom, width, height } = node.getBoundingClientRect();
    return { left: left - fieldBounds.left, right: right - fieldBounds.left, top: top - fieldBounds.top, bottom: bottom - fieldBounds.top, width, height };
  };
  const node = id => $(`[data-node="${id}"]`, field);
  const bounds = id => box(node(id));
  const center = b => b.top + b.height / 2;
  const endpoint = (id, side, dy = 0, level = id) => {
    const outer = bounds(id);
    return { x: outer[side] + (side === "right" ? .8 : -.8), y: center(bounds(level)) + dy };
  };
  const alignRow = (id, side, row) => ({ ...endpoint(id, side), y: center(box(row)) });
  const curve = (a, b, t = .54) => {
    const dx = (b.x - a.x) * t;
    return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y} ${b.x - dx} ${b.y} ${b.x} ${b.y}`;
  };
  const sideLoop = (a, b, offset) => {
    const x = Math.min(a.x, b.x) - offset;
    const bend = Math.min(11, (b.y - a.y) / 3);
    return `M ${a.x} ${a.y} C ${x} ${a.y} ${x} ${a.y + bend / 2} ${x} ${a.y + bend}
      L ${x} ${b.y - bend} C ${x} ${b.y - bend / 2} ${x} ${b.y} ${b.x} ${b.y}`;
  };
  const add = (name, tone, a, b, path = curve(a, b), live = false) => routes.push({ name, tone, a, b, path, live });
  const router = bounds("router");
  const hub = bounds("hub");
  const spineX = router.left + router.width * .53;
  const routerOut = { x: spineX, y: router.bottom + .8 };
  const hubIn = { x: spineX, y: hub.top - .8 };

  add("chat-fast", "fast", endpoint("chat", "right", -7), endpoint("router", "left", 0, "fast"), undefined, true);
  add("chat-slow", "router", endpoint("chat", "right", 7), endpoint("router", "left", -7, "slow"));
  add("feishu-slow", "router", endpoint("feishu", "right", -3), endpoint("router", "left", 7, "slow"));
  add("feishu-direct", "direct", endpoint("feishu", "right", 11), endpoint("hub", "left", -12));
  add("github-direct", "direct", endpoint("github", "right"), endpoint("hub", "left"));
  add("timer-direct", "direct", endpoint("timer", "right"), endpoint("hub", "left", 12));
  add("router-hub", "router", routerOut, hubIn, `M ${spineX} ${routerOut.y} V ${hubIn.y}`);

  const bindings = [["orders", "codex", -12, 14], ["docs", "claude", 0, 10], ["ajinos", "codex", 12, 6]];
  for (const [project, worker, shift, offset] of bindings) {
    add("hub-" + project, "router", endpoint("hub", "right", shift), endpoint(project, "left", -6));
    const a = endpoint(project, "left", 12);
    const b = endpoint("workers", "left", project === "ajinos" ? 8 : 0, worker);
    add(project + "-" + worker, "worker-link", a, b, sideLoop(a, b, offset), project === "orders");
  }
  const approval = $('[data-node="approval"] [data-ticket]', field);
  if (approval) add("ask", "approval", endpoint("orders", "right"), alignRow("approval", "left", approval));
  const reviewRows = all('[data-node="review"] [data-ticket]', field);
  for (const row of reviewRows) {
    const { worker, id } = ticket(row.dataset.ticket);
    const a = endpoint("workers", "right", 0, worker);
    add(worker + "-" + id, "receipt", a, alignRow("review", "left", row));
  }
  if (item?.state === "closed" && item.worker) {
    add(item.worker + "-review", "receipt", endpoint("workers", "right", 0, item.worker), endpoint("review", "left", -10));
  }
  add("signoff", "receipt", endpoint("review", "left", bounds("review").height / 2 - 11),
    endpoint("closed", "left"), sideLoop(endpoint("review", "left", bounds("review").height / 2 - 11), endpoint("closed", "left"), 9));

  svg.classList.toggle("tracking", Boolean(trace));
  all("[data-node]", field).forEach(element => element.classList.toggle("on-path", Boolean(trace?.nodes.includes(element.dataset.node))));
  all("[data-ticket]", field).forEach(element => element.classList.toggle("on-path", element.dataset.ticket === tracked));
  svg.innerHTML = routes.map(({ name, tone, a, b, path, live }, index) => {
    const hot = trace?.edges.includes(name);
    const classes = `${tone}${hot ? " hot" : ""}`;
    const ports = [a, b].map(point => `<circle class="port ${classes}" cx="${point.x}" cy="${point.y}" r="${hot ? 2.7 : 2}"/>`).join("");
    const packet = hot || (!trace && live) ? `<circle class="packet ${tone}" r="${hot ? 3.7 : 2.6}" opacity="${hot ? 1 : .62}">
      <animateMotion dur="${hot ? 2.5 : 4.1}s" begin="${-(index % 6) * .41}s" repeatCount="indefinite" path="${path}"/>
    </circle>` : "";
    return `<g><path class="wire ${classes}" data-edge="${name}" d="${path}"/>${ports}${packet}</g>`;
  }).join("");
  const focused = item ? `${item.id} · ${item.title}` : flash?.label;
  const caption = focused ? `<div class="row track-caption">${icon("track")}<strong>${safe(focused)}</strong>
    ${item ? statusChip(item) : ""}<button class="icon-btn clear" data-do="clear-track" aria-label="清除路径高亮" title="清除高亮">${icon("close")}</button></div>` :
    '<div class="row legend"><span><i class="legend-line"></i>总管路由</span><span><i class="legend-line direct"></i>标准事件直达</span><span><i class="legend-line receipt"></i>执行回执与签收</span></div>';
  if ($("#map-caption").innerHTML !== caption) $("#map-caption").innerHTML = caption;
}

function scheduleWires() {
  if (wireFrame) return;
  wireFrame = requestAnimationFrame(() => {
    wireFrame = null;
    drawWires();
  });
}

const observer = new ResizeObserver(scheduleWires);
function render() {
  updateShell();
  const workspace = $("#workspace");
  observer.disconnect();
  const renderView = {
    flow: flowView, dag: planView, capabilities: capabilitiesView,
    inbox: () => listView([["approval", "待拍板"], ["review", "待验收"]], "待我处理", true),
    board: boardView,
    chat: chatView, thread: chatView, threads: chatView,
  };
  workspace.innerHTML = renderView[view]();
  const field = $(".flow-body");
  if (field) observer.observe(field);
  renderDrawer();
  drawWires();
}

function updateURL() {
  const url = new URL(location.href);
  url.searchParams.set("variant", variant);
  url.searchParams.set("theme", theme);
  if (tracked) url.searchParams.set("track", tracked);
  else url.searchParams.delete("track");
  history.replaceState(null, "", url);
}

function showNotice(message) {
  const notice = $("#notice");
  notice.textContent = message;
  notice.hidden = false;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { notice.hidden = true; }, 3800);
}

function go(next) {
  if (view === next && !drawer) return;
  view = next;
  drawer = null;
  render();
  $("#workspace").scrollTop = 0;
}

function setTracking(id) {
  tracked = id;
  flash = null;
  clearTimeout(flashTimer);
  updateURL();
  all(".activity-chip").forEach(button => button.setAttribute("aria-pressed", button.dataset.ticket === id));
  const label = $(".track-control span");
  if (label) label.textContent = id || "跟踪任务";
  drawWires();
}

function openDrawer(type, id, origin) {
  drawerOrigin = origin;
  drawer = { type, id };
  renderDrawer();
  $("#drawer [data-do='close-drawer']").focus({ preventScroll: true });
  scheduleWires();
}

function closeDrawer() {
  drawer = null;
  renderDrawer();
  const anchor = drawerOrigin?.isConnected && !drawerOrigin.closest("[hidden], [inert]") ? drawerOrigin :
    (tracked && $(`#workspace [data-ticket="${tracked}"]:not(.track-menu *)`)) || $("#workbench-tabs button");
  anchor?.focus({ preventScroll: true });
  scheduleWires();
}

function openComposer() {
  const dialog = $("#compose-dialog");
  if (view === "flow" && variant === "composer") {
    $(".dock input[type=text]").focus();
  } else if (!dialog.open) {
    $("#dialog-form").innerHTML = composer();
    dialog.showModal();
    $("input[type=text]", dialog).focus();
  }
}

function resetComposerAfterSend(entry, messageType, project) {
  const dialog = $("#compose-dialog");
  if (dialog.open) dialog.close();
  exchanges.push(entry);
  draft = { text: "", attachment: "", project: "" };
  tracked = "";
  view = "flow";
  drawer = null;
  clearTimeout(flashTimer);
  flash = {
    nodes: ["chat", "router", messageType],
    edges: ["chat-" + messageType],
    label: entry.reply,
  };
  if (project) {
    flash.nodes.push("hub", project);
    flash.edges.push("router-hub", "hub-" + project);
  }
  updateURL();
  render();
  showNotice(entry.reply);
  flashTimer = setTimeout(() => { flash = null; drawWires(); }, 4300);
}

function sendDraft() {
  const text = draft.text.trim();
  if (!text && !draft.attachment) return;
  const related = Object.keys(projects).filter(id => text.includes(projects[id].name));
  const isPlan = /跨项目|DAG|协作计划/i.test(text) || related.length > 1;
  const isDigest = !isPlan && /简报|进度|待我处理|状态|进展/.test(text);
  if (isDigest) digestCount += 1;
  const project = !isDigest && !isPlan ? draft.project || related[0] : "";
  const reply = isDigest ? `只读简报 · ${inState("running").length} 执行中 · ${countPending()} 待你处理` :
    isPlan ? "已进入跨项目分诊 · DAG 计划须经本人确认" :
    project ? `单项目派发预览 · ${projects[project].name}` : "已进入分诊 · 请补充要处理的项目";
  resetComposerAfterSend({ text, attachment: draft.attachment, reply }, isDigest ? "fast" : "slow", project);
}

function togglePopover(button, element) {
  element.hidden = !element.hidden;
  button.setAttribute("aria-expanded", !element.hidden);
}

function closePopovers(except) {
  for (const popover of all(".popover:not([hidden])")) {
    const button = popover.previousElementSibling;
    if (!popover.contains(except) && !button.contains(except)) {
      popover.hidden = true;
      button.setAttribute("aria-expanded", "false");
    }
  }
}

$(".brand").innerHTML = icon("brand");
$("#top-send").innerHTML = icon("send") + '<span>发给总管</span><kbd>Alt+Shift+A</kbd>';
$("[data-do='close-compose']").innerHTML = icon("close");
$("#compose-dialog").addEventListener("close", event => {
  if (!event.currentTarget.open) $("#dialog-form").replaceChildren();
});

document.addEventListener("click", event => {
  const button = event.target.closest("button");
  closePopovers(event.target);
  if (!button) return;
  const { go: next, variantMode, detail, ticket: id, track, thread: threadId, follow, accept, answer } = button.dataset;
  if (variantMode && variantMode !== variant) {
    variant = variantMode;
    updateURL();
    render();
  } else if (next) {
    go(next);
  } else if (detail) {
    openDrawer("node", detail, button);
  } else if (id) {
    if (track && view === "flow") setTracking(id);
    openDrawer("ticket", id, button);
    closePopovers(null);
  } else if (threadId) {
    thread = threadId;
    go("thread");
  } else if (follow) {
    go("flow");
    setTracking(follow);
  } else if (accept && ticket(accept).state === "review") {
    ticket(accept).state = "closed";
    ticket(accept).summary += " 本人已核对验收依据并签收。";
    render();
    showNotice(`${accept} 已通过验收 · 本人签收 +1`);
  } else if (answer && ticket(answer).state === "approval") {
    const item = ticket(answer);
    const read = $("#approval-decision").value === "read";
    item.state = read ? "queued" : "declined";
    item.decision = read ? "只读预检" : "拒绝执行";
    item.summary = read ? "本人已允许只读预检，原事项等待重新领取。" : "本人已拒绝这项请求。";
    render();
    showNotice(`${answer} · 已记录本人决定`);
  } else {
    const form = button.closest("form");
    switch (button.dataset.do) {
      case "theme":
        theme = theme === "dark" ? "light" : "dark";
        updateShell();
        updateURL();
        break;
      case "track-menu": togglePopover(button, $("#track-menu")); break;
      case "clear-track": setTracking(""); break;
      case "close-drawer": closeDrawer(); break;
      case "compose": openComposer(); break;
      case "close-compose": $("#compose-dialog").close(); break;
      case "attach": $('input[type="file"]', form).click(); break;
      case "override": togglePopover(button, $(".override-menu", form)); break;
      case "remove-attachment":
        draft.attachment = "";
        refreshForm(form);
        break;
    }
  }
});

function refreshForm(form) {
  form.outerHTML = composer();
  const activeForm = $("#compose-dialog[open] .composer") || $("#workspace .composer");
  $("input[type=text]", activeForm).focus();
}

document.addEventListener("input", event => {
  if (!event.target.matches('.composer input[name="message"]')) return;
  draft.text = event.target.value;
  $(".send", event.target.form).disabled = !draft.text.trim() && !draft.attachment;
});
document.addEventListener("change", event => {
  if (event.target.matches('.composer input[type="file"]') && event.target.files[0]) {
    draft.attachment = event.target.files[0].name;
    refreshForm(event.target.form);
  }
  if (event.target.matches('.composer select[name="project"]')) draft.project = event.target.value;
});
document.addEventListener("submit", event => {
  if (!event.target.matches(".composer")) return;
  event.preventDefault();
  sendDraft();
});
document.addEventListener("keydown", event => {
  if (event.code === "KeyA" && event.altKey && event.shiftKey && !event.ctrlKey) {
    event.preventDefault();
    openComposer();
  }
  if (event.key === "Escape" && !$("#compose-dialog").open) {
    if ($(".popover:not([hidden])")) closePopovers(null);
    else if (drawer) closeDrawer();
    else if (tracked || flash) setTracking("");
  }
});

const initialTicket = ticket(query.get("track"));
if (initialTicket) {
  tracked = initialTicket.id;
  drawer = { type: "ticket", id: tracked };
}
render();
</script>
</body>
</html>
